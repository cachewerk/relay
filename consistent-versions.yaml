checks:
  relay-version:
    normalize:
      - trim-v-prefix
      - version

    expected:
      reader: yaml
      file: .github/workflows/docker.yml
      path: $.jobs.packages.env.RELAY_VERSION

    values:
      docker-workflow-artifact-matrix:
        reader: yaml
        file: .github/workflows/docker.yml
        path: $.jobs.artifacts.strategy.matrix.version[0]

      docker-alpine:
        reader: dockerfile
        file: docker/alpine.Dockerfile
        path: $.args.RELAY

      docker-al2:
        reader: dockerfile
        file: docker/al2.Dockerfile
        path: $.args.RELAY

      docker-al2023:
        reader: dockerfile
        file: docker/al2023.Dockerfile
        path: $.args.RELAY

